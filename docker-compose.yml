# KAP Guyane — scalable deployment.
#
#   console (nginx, :80 → :443 HTTPS) ──► backend (API, FastAPI) ──► postgres (PostgreSQL 16)
#                                        │      ▲                 ▲
#                                        ▼      │                 │
#                                      redis (shared state, locks, Celery broker)
#                                        ▲
#        worker (source health, audit check, data refresh, notifications)
#        worker-analysis (satellite analyses, open-data syncs — one at a time) · beat (scheduler)
#        docs (knowledge base) · notif-sink (PoC notifications) · certbot (Let's Encrypt)
#
# Passwords and the master key are docker secrets generated by `make secrets` (secrets/, never committed).

x-hardening: &hardening
  read_only: true
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  restart: unless-stopped

x-backend-image: &backend-image
  build:
    context: ./backend
    target: production
    args:
      APP_UID: ${APP_UID:-1000}
  image: kap-backend:local

x-backend-env: &backend-env
  ENVIRONMENT: ${ENVIRONMENT:-production}
  KEYS_DIR: /keys
  CACHE_DIR: /cache
  DATA_DIR: /data
  BACKUP_DIR: /backups
  LOG_LEVEL: INFO
  DATABASE_URL: postgresql://kap@postgres:5432/kap
  DATABASE_PASSWORD_FILE: /run/secrets/postgres_password
  REDIS_URL: redis://redis:6379/0
  REDIS_PASSWORD_FILE: /run/secrets/redis_password
  # Master key outside the keys/ volume (and therefore outside backups).
  MASTER_KEY_FILE: /run/secrets/master_key
  CELERY_BROKER_URL: ${CELERY_BROKER_URL:-}
  BACKGROUND_MODE: workers
  # PoC: local notification sink trusted over plain http (see notif-sink/).
  WEBHOOK_ALLOWED_HOSTS: '["notif-sink"]'
  # One sink channel per platform channel (veille, analyses, donnees, decisions, securite).
  ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-http://notif-sink:8090/hooks/__CHANNEL__}
  COOKIE_SECURE: "true"
  PUBLIC_URL: ${PUBLIC_URL:-https://${DOMAIN:-localhost}}

x-backend-secrets: &backend-secrets
  - postgres_password
  - redis_password
  - master_key

services:
  postgres:
    image: postgres:16.6-alpine
    container_name: kap-postgres
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_DB: kap
      POSTGRES_USER: kap
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kap -d kap"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  redis:
    image: redis:7.4.1-alpine
    container_name: kap-redis
    <<: *hardening
    user: "999:1000"
    secrets:
      - redis_password
    command: ["sh", "-c", "exec redis-server --requirepass \"$$(cat /run/secrets/redis_password)\" --appendonly yes --dir /data --maxmemory 256mb --maxmemory-policy noeviction"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$(cat /run/secrets/redis_password)\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    <<: [*hardening, *backend-image]
    container_name: kap-engine
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - path: .env
        required: false
    environment: *backend-env
    secrets: *backend-secrets
    volumes:
      - ./keys:/keys
      - ./cache:/cache
      - ./data:/data
      - ./backups:/backups
    tmpfs:
      - /tmp
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Source health, hourly audit check and data refresh, webhook deliveries (retried).
  worker:
    <<: [*hardening, *backend-image]
    container_name: kap-worker
    command: ["celery", "-A", "app.worker", "worker", "-Q", "default,notify", "-c", "2", "-n", "general@%h",
              "--without-gossip", "--without-mingle", "-l", "INFO"]
    env_file:
      - path: .env
        required: false
    environment: *backend-env
    secrets: *backend-secrets
    volumes:
      - ./keys:/keys
      - ./cache:/cache
    tmpfs:
      - /tmp
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.worker inspect ping -d general@$$HOSTNAME --timeout 10 | grep -q pong"]
      interval: 60s
      timeout: 20s
      retries: 3
      start_period: 40s

  # Satellite analyses (Sentinel-2 series, WSF, footprints) and open-data syncs: one at a time,
  # fresh process after each (frees GDAL memory).
  worker-analysis:
    <<: [*hardening, *backend-image]
    container_name: kap-worker-analysis
    command: ["celery", "-A", "app.worker", "worker", "-Q", "analysis", "-c", "1", "--max-tasks-per-child", "1",
              "-n", "analysis@%h", "--without-gossip", "--without-mingle", "-l", "INFO"]
    env_file:
      - path: .env
        required: false
    environment: *backend-env
    secrets: *backend-secrets
    volumes:
      - ./keys:/keys
      - ./cache:/cache
    tmpfs:
      - /tmp
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.worker inspect ping -d analysis@$$HOSTNAME --timeout 10 | grep -q pong"]
      interval: 60s
      timeout: 20s
      retries: 3
      start_period: 40s

  beat:
    <<: [*hardening, *backend-image]
    container_name: kap-beat
    command: ["celery", "-A", "app.worker", "beat", "-l", "INFO", "-s", "/tmp/celerybeat-schedule"]
    environment: *backend-env
    secrets: *backend-secrets
    tmpfs:
      - /tmp
    depends_on:
      backend:
        condition: service_healthy

  # Console (nginx). HTTPS on 443 (Let's Encrypt certificate for DOMAIN, self-signed until
  # issued); port 80 only answers the ACME challenge and redirects to HTTPS.
  console:
    <<: *hardening
    build:
      context: ./frontend
    container_name: kap-console
    ports:
      - "${CONSOLE_BIND:-127.0.0.1}:${HTTP_PORT:-80}:8080"
      - "${CONSOLE_BIND:-127.0.0.1}:${HTTP_ALT_PORT:-8080}:8080"
      - "${CONSOLE_BIND:-127.0.0.1}:${HTTPS_PORT:-443}:8443"
    environment:
      DOMAIN: ${DOMAIN:-}
    volumes:
      - certbot-www:/var/www/certbot:ro
      - tls-certs:/certs:ro
    tmpfs:
      - /tmp
    depends_on:
      backend:
        condition: service_healthy
      docs:
        condition: service_started

  # Knowledge base (MkDocs Material, static), served through the console at /docs/.
  docs:
    <<: *hardening
    build:
      context: ./docs
    container_name: kap-docs
    tmpfs:
      - /tmp

  # Test runner (make test / make test-pg): production image + pytest, never started by `make up`.
  backend-test:
    profiles: ["test"]
    build:
      context: ./backend
      target: test
      args:
        APP_UID: ${APP_UID:-1000}
    image: kap-backend:test
    environment:
      DATABASE_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    tmpfs:
      - /tmp

  # Let's Encrypt (HTTP-01 through the console's port 80). Idle when DOMAIN is empty (local use).
  certbot:
    image: certbot/certbot:v3.0.1
    container_name: kap-certbot
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
    environment:
      DOMAIN: ${DOMAIN:-}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL:-}
      LETSENCRYPT_STAGING: ${LETSENCRYPT_STAGING:-0}
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot-www:/var/www/certbot
      - tls-certs:/certs
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        trap exit TERM
        if [ -z "$$DOMAIN" ]; then echo "DOMAIN not set: no Let's Encrypt certificate (self-signed in use)"; exec sleep infinity; fi
        staging=""; [ "$$LETSENCRYPT_STAGING" = "1" ] && staging="--staging"
        email="--register-unsafely-without-email"; [ -n "$$LETSENCRYPT_EMAIL" ] && email="--email $$LETSENCRYPT_EMAIL"
        sleep 10
        while :; do
          if certbot certonly --webroot -w /var/www/certbot -d "$$DOMAIN" $$email $$staging                --agree-tos --no-eff-email --non-interactive --keep-until-expiring; then
            live=/etc/letsencrypt/live/$$DOMAIN
            for f in fullchain:644 privkey:600; do
              name=$${f%%:*}; mode=$${f##*:}
              cp "$$live/$$name.pem" "/certs/$$name.pem.new"
              chmod "$$mode" "/certs/$$name.pem.new"
              chown 101:101 "/certs/$$name.pem.new"
              mv -f "/certs/$$name.pem.new" "/certs/$$name.pem"
            done
            wait_s=43200
          else
            echo "Certificate request failed: is $$DOMAIN pointing to this server and port 80 open?"
            wait_s=900
          fi
          sleep $$wait_s & wait $$!
        done
    depends_on:
      - console

  # PoC only: local stand-in for Slack / Mattermost, viewed through the console at /notifs/.
  notif-sink:
    <<: *hardening
    build:
      context: ./notif-sink
    container_name: kap-notif-sink
    ports:
      - "127.0.0.1:8090:8090"

secrets:
  postgres_password:
    file: ./secrets/postgres_password
  redis_password:
    file: ./secrets/redis_password
  master_key:
    file: ./secrets/master_key

volumes:
  pgdata:
  redisdata:
  letsencrypt:
  certbot-www:
  tls-certs:
